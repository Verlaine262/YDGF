<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广附视频</title><link rel="stylesheet" href="video.css"><body><header><a class="brand" href="../#home" target="_top"><b>▶</b> 广附视频</a><form id="search-form"><input id="search" type="search" aria-label="搜索视频" placeholder="搜索视频"><button>⌕</button></form><button id="add">＋ 添加直链</button><label class="button">打开本机视频<input type="file" id="local" accept="video/*" multiple hidden></label></header><div class="layout"><aside><button data-view="all" aria-current="true">⌂ 首页</button><button data-view="saved">▤ 稍后观看</button><button data-view="history">◷ 观看记录</button><hr><a href="../#community" target="_top">广附社区 ↗</a><a href="../#galgame" target="_top">视觉小说 ↗</a><p>本机收藏与历史<br>不上传视频、不虚构播放量</p></aside><main><nav id="chips"><button data-category="全部" aria-pressed="true">全部</button><button data-category="动画">动画</button><button data-category="我的视频">我的视频</button></nav><section id="watch" hidden><video id="player" controls playsinline preload="metadata"></video><h1 id="watch-title"></h1><p id="watch-source"></p><div class="actions"><button id="save">加入稍后观看</button><button id="next">播放下一个</button><label><input id="autonext" type="checkbox"> 自动连播</label><button id="close">返回浏览</button></div><p id="play-status" role="status"></p></section><div class="heading"><h2 id="heading">为你发现</h2><button id="clear" hidden>清空观看记录</button></div><p id="status" role="status"></p><section id="grid"></section><section class="notice">视频示例来自外部站点，加载取决于网络。可添加 HTTPS 视频直链（MP4 / WebM 等），普通视频平台页面链接不能直接播放。本机文件刷新后需重新打开。</section></main></div><dialog id="dialog"><form id="add-form"><h2>添加视频直链</h2><label>标题<input id="title" required maxlength="100" placeholder="给视频起个名字"></label><label>HTTPS 视频地址<input id="url" required type="url" placeholder="https://example.com/video.mp4"></label><p>直链仅保存在当前浏览器。打开时会向该视频地址发出请求。</p><button type="submit">添加</button><button type="button" id="cancel">取消</button><p id="form-error" role="status"></p></form></dialog><script src="video.js"></script></body></html>
